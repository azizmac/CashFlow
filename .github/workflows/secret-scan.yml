name: secret-scan
# Та же проверка, что и в pre-commit: реальные реквизиты, ключи и пароли не должны попасть в репозиторий.
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/secret-scan.py
