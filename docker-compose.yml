# CashFlow AI — self-hosted.
# 1) cp .env.example .env  2) заполнить ключи  3) docker compose up -d  4) http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cashflow
      POSTGRES_USER: cashflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashflow -d cashflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=cashflow;Username=cashflow;Password=${POSTGRES_PASSWORD}"
      # Ключ шифрования полей (ИНН, счета, телефоны, токены API). Сгенерировать: openssl rand -base64 32
      Encryption__MasterKey: ${ENCRYPTION_MASTER_KEY:?set ENCRYPTION_MASTER_KEY in .env}
      Sync__IntervalHours: ${SYNC_INTERVAL_HOURS:-6}
      CASHFLOW_TZ: ${CASHFLOW_TZ:-Europe/Moscow}
    volumes:
      - dpkeys:/root/.aspnet/DataProtection-Keys

volumes:
  pgdata:
  dpkeys:
