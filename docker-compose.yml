# CashFlow AI — self-hosted.
# 1) cp .env.example .env  2) заполнить ключи  3) docker compose up -d  4) http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cashflow
      POSTGRES_USER: cashflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${DB_PORT:-127.0.0.1:55432}:5432"   # для настольного приложения (встроенный сервер) на этой же машине
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashflow -d cashflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=cashflow;Username=cashflow;Password=${POSTGRES_PASSWORD}"
      # Ключ шифрования полей (ИНН, счета, телефоны, токены API). Сгенерировать: openssl rand -base64 32
      Encryption__MasterKey: ${ENCRYPTION_MASTER_KEY:?set ENCRYPTION_MASTER_KEY in .env}
      Sync__IntervalHours: ${SYNC_INTERVAL_HOURS:-6}
      CASHFLOW_TZ: ${CASHFLOW_TZ:-Europe/Moscow}
      # Подключение банков «через авторизацию» (необязательно). Публичный адрес нужен для redirect URI за reverse proxy.
      Integrations__PublicBaseUrl: ${PUBLIC_BASE_URL:-}
      Integrations__Sber__ClientId: ${SBER_CLIENT_ID:-}
      Integrations__Sber__ClientSecret: ${SBER_CLIENT_SECRET:-}
      Integrations__Sber__CertPfxPath: ${SBER_CERT_PFX_PATH:-}
      Integrations__Sber__CertPassword: ${SBER_CERT_PASSWORD:-}
      Integrations__Alfa__ClientId: ${ALFA_CLIENT_ID:-}
      Integrations__Alfa__ClientSecret: ${ALFA_CLIENT_SECRET:-}
      Integrations__TBank__ClientId: ${TBANK_CLIENT_ID:-}
      Integrations__TBank__ClientSecret: ${TBANK_CLIENT_SECRET:-}
    volumes:
      - dpkeys:/root/.aspnet/DataProtection-Keys
      - ./secrets:/secrets:ro   # сюда положите sber.pfx и укажите SBER_CERT_PFX_PATH=/secrets/sber.pfx

volumes:
  pgdata:
  dpkeys:
